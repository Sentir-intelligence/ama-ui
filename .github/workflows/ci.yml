name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated files match tokens
        run: npm run tokens:check
      - name: WCAG 2.2 AA contrast suite
        run: npm run contrast
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (ESLint + Stylelint)
        run: npm run lint
      - name: Tailwind build
        run: npm run css
      - name: Tests
        run: npm test
      - name: Registry build
        run: npm run registry
